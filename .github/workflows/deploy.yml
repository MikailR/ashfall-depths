name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  import:
    name: Import production build
    runs-on: ubuntu-latest
    steps:
      - name: Obtain build
        env:
          # The Vite production build exported from the development sandbox. When the hash below
          # changes the tarball is re-downloaded; otherwise the copy on gh-pages is reused.
          BUILD_URL: https://sudden-ids-because-files.trycloudflare.com/dist.tgz
          BUILD_SHA256: f215a35ea3e53c8a39e93edb9644aadca781f54d256ffeae0eb0246f6b6f9dfa
        run: |
          set -euo pipefail
          reuse=0
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" gh-pages >/dev/null 2>&1; then
            git clone --quiet --depth=1 --branch gh-pages "https://github.com/${GITHUB_REPOSITORY}.git" site
            rm -rf site/.git
            if [ -f site/.build-sha256 ] && [ "$(cat site/.build-sha256)" = "$BUILD_SHA256" ]; then
              echo "Reusing build $BUILD_SHA256 from gh-pages"
              reuse=1
            else
              rm -rf site
            fi
          fi
          if [ "$reuse" = 0 ]; then
            echo "Downloading build from ${BUILD_URL}"
            mkdir -p site
            curl -fsSL --retry 5 --retry-delay 5 "$BUILD_URL" -o dist.tgz
            echo "${BUILD_SHA256}  dist.tgz" | sha256sum -c -
            tar -xzf dist.tgz -C site
            touch site/.nojekyll
            echo "$BUILD_SHA256" > site/.build-sha256
          fi
          ls -la site site/assets

      - name: Commit build to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd site
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Ashfall Depths demo build"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publishes through the Pages API. This job fails until GitHub Pages has been enabled once in
  # Settings -> Pages (the default GITHUB_TOKEN is not allowed to enable it); the gh-pages branch
  # produced above works with the "Deploy from a branch" mode regardless.
  deploy:
    name: Deploy to GitHub Pages
    needs: import
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
